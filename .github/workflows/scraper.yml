name: Run IPO Scraper & Real-Time Sync

on:
  schedule:
    # Runs every 3 hours daily (UTC) to capture market updates, GMP shifts, & upcoming IPOs
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sync, Analysis Engine & Alert Dispatcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sync_and_alert.py

      - name: Auto-commit updated local JSON cache
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/db_local.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update db_local.json cache [skip ci]" && git push)

